[project]
name = "truyenai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.8,<3",
    "arq>=0.26,<0.28",
    "httpx>=0.28,<1",
    # Kokoro-Vietnamese TTS runtime (package vendored at backend/kokoro_vietnamese/).
    "torch",
    # torch's cu13 nvidia bundle omits cuDNN; libcudnn.so.9 must come from this cu12
    # wheel or 'import torch' fails. cu12 runtime is backward-compatible on the CUDA 13 driver.
    "nvidia-cudnn-cu12",
    "transformers>=4.48,<5",
    "vig2p>=0.1.0",
    "soundfile",
    "loguru",
    "attrs",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
