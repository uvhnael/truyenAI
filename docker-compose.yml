services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truyenai
      POSTGRES_PASSWORD: truyenai
      POSTGRES_DB: truyenai
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truyenai"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://truyenai:truyenai@postgres:5432/truyenai
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: ${LLM_MODE:-auto}
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: arq app.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://truyenai:truyenai@postgres:5432/truyenai
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: ${LLM_MODE:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18080
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - api

volumes:
  redisdata:
  pgdata:
